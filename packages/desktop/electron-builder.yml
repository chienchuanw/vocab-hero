appId: com.vocab-hero.desktop
productName: Vocab Hero
copyright: Copyright (c) 2026 Vocab Hero

directories:
  output: release
  buildResources: build

files:
  - dist/electron/**/*
  - package.json
  - "!node_modules/electron/**"
  - "!node_modules/electron-builder/**"
  - "!node_modules/typescript/**"
  - "!node_modules/tsx/**"

asarUnpack:
  - "node_modules/@prisma/client/**/*"
  - "node_modules/@prisma/engines/**/*"
  - "node_modules/prisma/**/*"

afterPack: scripts/after-pack.js

extraResources:
  - from: "prisma"
    to: "prisma"
    filter:
      - "schema.prisma"
      - "seed.ts"

mac:
  category: public.app-category.education
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: build/icon.icns
  darkModeSupport: true
  identity: null

dmg:
  title: "Vocab Hero"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

publish:
  provider: github
  owner: chienchuanw
  repo: vocab-hero
